name: SpringTwelve Roothide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/.theos-ci
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and host tools
        run: |
          xcode-select -p
          xcrun --find clang
          brew install dpkg ldid
      - name: Fetch Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -a "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Verify preference navigation and key contract
        run: python3 scripts/verify-preferences.py
      - name: Build arm64e Roothide package and pinned LAME MP3 helper
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="5.2.0-${GITHUB_RUN_NUMBER}" sh build.sh roothide
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(find packages -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          mkdir "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/deb-root"
          DYLIB=$(find "$RUNNER_TEMP/deb-root" -name AxsSpringTwelve.dylib -print -quit)
          test -n "$DYLIB"
          xcrun lipo "$DYLIB" -verify_arch arm64e
          xcrun lipo "$DYLIB" -archs
          test "$(find "$RUNNER_TEMP/deb-root" -name '*.dylib' | wc -l | tr -d ' ')" = "1"
          HELPER_RECORD=$(find "$RUNNER_TEMP/deb-root" -path '*/usr/local/bin/MUtoolRecord' -type f -print -quit)
          HELPER_MIXER=$(find "$RUNNER_TEMP/deb-root" -path '*/usr/local/bin/MUtoolMixer' -type f -print -quit)
          test -n "$HELPER_RECORD" -a -n "$HELPER_MIXER"
          test -x "$HELPER_RECORD" -a -x "$HELPER_MIXER"
          xcrun lipo "$HELPER_RECORD" -verify_arch arm64e
          xcrun lipo "$HELPER_MIXER" -verify_arch arm64e
          test "$(shasum -a 256 "$HELPER_RECORD" | cut -d ' ' -f 1)" = "f00d1331cd5c820432ba23fd3616cbc836f2e4b84df6ce2c3babc58381b0baea"
          test "$(shasum -a 256 "$HELPER_MIXER" | cut -d ' ' -f 1)" = "368d638ffdc2724431be66fbb8586a2d0521a1bef70c54b1731b9b891278fa60"
          ldid -e "$HELPER_RECORD" | grep -q 'com.apple.coreaudio.CanTapTelephony'
          ldid -e "$HELPER_RECORD" | grep -q 'com.apple.coreaudio.private.SystemWideTap'
          test -f "$RUNNER_TEMP/deb-root/var/jb/Library/PreferenceBundles/AxsSpringTwelvePrefs.bundle/Info.plist" -o -f "$RUNNER_TEMP/deb-root/Library/PreferenceBundles/AxsSpringTwelvePrefs.bundle/Info.plist"
          python3 scripts/verify-recording-package.py "$DEB"
      - uses: actions/upload-artifact@v4
        with:
          name: SpringTwelve-Roothide-${{ github.run_number }}
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
