name: SpringTwelve Roothide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      THEOS: ${{ runner.temp }}/theos
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ldid dpkg xz
      - name: Prepare Theos and SDK
        run: |
          git clone --depth 1 --recursive --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdk-src"
          git -C "$RUNNER_TEMP/sdk-src" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/sdk-src/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Build Roothide
        run: make package THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e PACKAGE_VERSION="5.2.0-$GITHUB_RUN_NUMBER" FINALPACKAGE=1
      - name: Verify package
        run: |
          set -eu
          pkg=$(ls packages/*.deb)
          test "$(dpkg-deb -f "$pkg" Architecture)" = iphoneos-arm64e
          dpkg-deb -x "$pkg" "$RUNNER_TEMP/extracted"
          cd "$RUNNER_TEMP/extracted"
          d=$(find . -name AxsSpringTwelve.dylib)
          test -f "$d"
          lipo -verify_arch arm64e "$d"
          test -n "$(find . -path '*/AxsSpringTwelvePrefs.bundle/Info.plist')"
      - uses: actions/upload-artifact@v4
        with:
          name: SpringTwelve-Roothide
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish test package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v5.2.0-$GITHUB_RUN_NUMBER" packages/*.deb --prerelease --title "桌面十二项 · Roothide 5.2.0-$GITHUB_RUN_NUMBER" --notes "云编译测试包，未做真机功能验收。"
