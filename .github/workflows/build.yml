name: SpringTwelve Roothide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/.theos-ci
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and host tools
        run: |
          xcode-select -p
          xcrun --find clang
          brew install dpkg ldid
      - name: Fetch Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -a "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Build arm64e Roothide package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="5.2.0-${GITHUB_RUN_NUMBER}" sh build.sh roothide
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(find packages -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          mkdir "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/deb-root"
          DYLIB=$(find "$RUNNER_TEMP/deb-root" -name AxsSpringTwelve.dylib -print -quit)
          test -n "$DYLIB"
          xcrun lipo "$DYLIB" -verify_arch arm64e
          xcrun lipo "$DYLIB" -archs
          test "$(find "$RUNNER_TEMP/deb-root" -name '*.dylib' | wc -l | tr -d ' ')" = "1"
          test -f "$RUNNER_TEMP/deb-root/var/jb/Library/PreferenceBundles/AxsSpringTwelvePrefs.bundle/Info.plist" -o -f "$RUNNER_TEMP/deb-root/Library/PreferenceBundles/AxsSpringTwelvePrefs.bundle/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: SpringTwelve-Roothide-${{ github.run_number }}
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
