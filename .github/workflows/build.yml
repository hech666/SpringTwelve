name: SpringTwelve Roothide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/.theos-ci
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and host tools
        run: |
          xcode-select -p
          xcrun --find clang
          brew install dpkg ldid
      - name: Fetch Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -a "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Verify preference navigation and key contract
        run: python3 scripts/verify-preferences.py
      - name: Build arm64e Roothide package without recording
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="5.2.0-${GITHUB_RUN_NUMBER}" sh build.sh roothide
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(python3 -c 'from pathlib import Path; print(next(Path("packages").glob("*.deb")))')
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          python3 scripts/verify-package.py "$DEB"
      - uses: actions/upload-artifact@v4
        with:
          name: SpringTwelve-Roothide-${{ github.run_number }}
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
